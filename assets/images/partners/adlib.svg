<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" />
  
  <g transform="translate(10, 5)">
    <!-- Monogram Icon -->
    <g stroke="#E50914" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left circle loop of 'a' -->
      <path d="M 28,35 C 28,18 5,18 5,35 C 5,52 28,52 28,35 Z" />
      <!-- Right curve loop of 'c' -->
      <path d="M 28,35 C 28,18 51,18 51,35 C 51,52 28,52 28,35 Z" />
      <!-- Vertical dividing line in center -->
      <path d="M 28,21 L 28,49" />
    </g>
    
    <!-- Text 'adlib' -->
    <text x="65" y="44" font-family="'Montserrat', 'Outfit', 'Arial', sans-serif" font-weight="700" font-size="34" fill="#E50914" letter-spacing="-0.5">adlib</text>
    
    <!-- TM Symbol -->
    <text x="146" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="10" fill="#E50914">TM</text>
  </g>
</svg>
