    </g>
    
    <!-- Text 'anzara' -->
    <text x="65" y="44" font-family="'Didot', 'Playfair Display', 'Bodoni MT', 'Georgia', serif" font-weight="700" font-size="38" fill="#FFFFFF" letter-spacing="-1">anzara</text>
  </g>
