<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" />
  
  <g transform="translate(10, 5)">
    <!-- Gold Flourish -->
    <g fill="none" stroke="#D4AF37" stroke-linecap="round">
      <!-- Main curve -->
      <path d="M 10,25 C 25,8 48,15 48,32 C 48,46 30,52 12,50 C 22,50 35,46 38,36 C 40,24 24,18 15,30" stroke-width="3.5" />
      <!-- Secondary curve -->
